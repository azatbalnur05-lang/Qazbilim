<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="QAZBILIM GROUP — ЕНТ, IELTS, SAT, NUET, NIS, BIL, РФМШ емтихандарына дайындық. 12 жылдық тәжірибе, 13 000+ түлек. Тегін сынақ сабағы. Астана.">
<meta property="og:title" content="QAZBILIM GROUP — білім орталығы">
<meta property="og:description" content="Үздік нәтижеге апаратын сенімді жол. Тегін сынақ сабағына yazылыңыз.">
<title>QAZBILIM GROUP — білім орталығы</title>
<style>
:root{--bg:#f4faf9;--surf:#fff;--ink:#0d2a4a;--mute:#53657c;--blue:#0b57a4;--teal:#00a38d;--line:#d9e8e5;--soft:#e4f4f1;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1626;--surf:#12243a;--ink:#eef5f4;--mute:#9db0c4;--blue:#5aa6ee;--teal:#2fd0b8;--line:#22405a;--soft:#0f2e3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1626;--surf:#12243a;--ink:#eef5f4;--mute:#9db0c4;--blue:#5aa6ee;--teal:#2fd0b8;--line:#22405a;--soft:#0f2e3a;color-scheme:dark}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background-color:var(--bg)}
a{color:inherit}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
header .w{display:flex;align-items:center;justify-content:space-between;height:64px}
.lg{display:flex;align-items:center;gap:10px;text-decoration:none}
.lg img{height:46px;width:46px;border-radius:12px;background:#fff;object-fit:cover}
.lg b{font-size:18px;color:var(--blue)}.lg b i{font-style:normal;color:var(--teal)}
nav a{margin-left:20px;color:var(--mute);text-decoration:none;font-size:14px}
@media(max-width:760px){nav{display:none}}
.btn{display:inline-block;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:700;padding:14px 26px;border-radius:999px;text-decoration:none;box-shadow:0 8px 20px rgba(0,163,141,.28)}
.btn.s{padding:9px 18px;font-size:14px;box-shadow:none}
.btn.o{background:transparent;color:var(--blue);border:2px solid var(--blue);box-shadow:none;padding:12px 24px}
.hero{padding:48px 0 70px;background:radial-gradient(900px 400px at 85% 0,var(--soft),transparent)}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
@media(max-width:820px){.hero .w{grid-template-columns:1fr}}
.tag{display:inline-block;background:var(--soft);color:var(--teal);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;margin-bottom:16px}
h1{font-size:clamp(30px,5.5vw,48px);line-height:1.12;margin:0 0 16px;color:var(--blue)}
h1 em{font-style:normal;color:var(--teal)}
.brand{font-size:clamp(48px,11vw,92px);line-height:1;margin:0 0 6px;font-weight:900;letter-spacing:-1px;animation:pop .9s ease both}
.brand .q{color:var(--blue)}.brand .b{color:var(--teal)}
.brand small{display:block;font-size:.36em;letter-spacing:.35em;color:var(--ink);margin-top:8px;font-weight:800}
.tl{font-size:clamp(20px,3.2vw,28px);margin:18px 0 12px;color:var(--ink)}.tl em{font-style:normal;color:var(--teal)}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.brand{animation:none}}
.hero p{color:var(--mute);font-size:18px;margin:0 0 26px;max-width:540px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ph{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end;max-width:420px;margin:0 auto}
.ph::before{content:"";position:absolute;inset:8% -6% -6% 10%;background:linear-gradient(135deg,var(--teal),var(--blue));border-radius:36px;opacity:.16;z-index:0}
.ph img{position:relative;z-index:1;width:100%;border-radius:22px;object-fit:cover;display:block;box-shadow:0 10px 28px rgba(13,42,74,.18)}
.ph img:first-child{aspect-ratio:2/3}.ph img:last-child{aspect-ratio:2/3;margin-bottom:34px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-36px;position:relative;z-index:2}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:20px 10px;text-align:center;box-shadow:0 6px 18px rgba(13,42,74,.06)}
.stat b{display:block;font-size:clamp(24px,5vw,38px);color:var(--teal)}
.stat span{color:var(--mute);font-size:14px}
section{padding:60px 0}
h2{font-size:clamp(24px,4vw,34px);margin:0 0 8px;color:var(--blue)}
.sub{color:var(--mute);margin:0 0 28px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px}
.c h3{margin:0 0 6px;font-size:19px;color:var(--blue)}
.c p{margin:0;color:var(--mute);font-size:15px}
.c.k{border-top:4px solid var(--teal)}
.adv{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media(max-width:820px){.adv{grid-template-columns:1fr}}
.adv img{width:100%;max-width:440px;border-radius:24px;box-shadow:0 10px 28px rgba(13,42,74,.18);display:block;margin:0 auto}
.list{display:grid;gap:12px}
.res{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.res{gap:8px}.res div{padding:16px 6px!important;font-size:12px!important}.res b{font-size:26px!important}}
.res div{background:linear-gradient(160deg,var(--blue),var(--teal));color:#fff;border-radius:18px;padding:22px 12px;text-align:center;font-size:14px}
.res b{display:block;font-size:36px;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:9px 20px;font-weight:600;color:var(--blue)}
.alt{background:var(--surf);border-block:1px solid var(--line)}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:820px){.ct{grid-template-columns:1fr}}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.soc a{background:var(--soft);color:var(--blue);border-radius:999px;padding:9px 18px;text-decoration:none;font-weight:600;font-size:15px}
.cta{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;text-align:center;border-radius:28px;padding:48px 20px}
.cta h2{color:#fff}.cta p{margin:0 0 22px;opacity:.92}
.cta .btn{background:#fff;color:#0b57a4;box-shadow:none}
footer{padding:26px 0 34px;text-align:center;color:var(--mute);font-size:14px}
</style>
</head>
